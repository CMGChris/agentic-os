name: upstream-sync

# Pulls new releases from the official starter, applies the Curiosity rebrand
# (curiosity/rebrand.mjs), and opens a pull request for review. Nothing reaches
# main until a person merges the pull request.
#
# One-time repo setting: Settings > Actions > General > Workflow permissions >
# tick "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '17 13 * * 1'   # Mondays, 8:17 AM Central (13:17 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: upstream-sync

env:
  UPSTREAM: https://github.com/ctskool/agentic-os-starter-v2.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the official starter
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --depth 1 upstream main
          sha=$(git rev-parse upstream/main)
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "BRANCH=sync/${sha:0:12}" >> "$GITHUB_ENV"

      - name: Decide whether there is anything new
        id: check
        run: |
          if [ "$(cat curiosity/UPSTREAM_COMMIT 2>/dev/null)" = "$SHA" ]; then
            echo "Already on upstream $SHA."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "A sync branch for $SHA already exists."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the rebranded release
        if: steps.check.outputs.skip != 'true'
        run: |
          up="$RUNNER_TEMP/upstream"
          mkdir -p "$up"
          git archive upstream/main | tar -x -C "$up"
          node curiosity/rebrand.mjs "$up"

          git switch -c "$BRANCH"
          # Workflow files are left out: the Actions token is not allowed to change them.
          rsync -a --delete \
            --exclude '/.git/' --exclude '/curiosity/' --exclude '/.github/workflows/' \
            "$up/" ./
          echo "$SHA" > curiosity/UPSTREAM_COMMIT

          # Safety net: the merged tree must be fully rebranded.
          node curiosity/rebrand.mjs . --check

          if ! diff -rq "$up/.github/workflows" .github/workflows --exclude upstream-sync.yml > "$RUNNER_TEMP/workflow-diff.txt"; then
            echo "WORKFLOWS_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Commit, push and open the pull request
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes after rebranding."; exit 0; fi
          git commit -m "Sync official starter ${SHA:0:12}"
          git push origin "$BRANCH"

          {
            echo "New release from the official starter, rebranded for Curiosity."
            echo
            echo "Upstream commit: https://github.com/ctskool/agentic-os-starter-v2/commit/$SHA"
            echo "Upstream changes: https://github.com/ctskool/agentic-os-starter-v2/compare/$(git show main:curiosity/UPSTREAM_COMMIT)...$SHA"
            echo
            echo "Tests are running on this branch (ci workflow). Merge once they pass."
            if [ "${WORKFLOWS_CHANGED:-}" = "true" ]; then
              echo
              echo "**Heads up:** the official starter changed its GitHub workflow files. Actions cannot edit those, so copy the changes in by hand:"
              echo '```'; cat "$RUNNER_TEMP/workflow-diff.txt"; echo '```'
            fi
          } > "$RUNNER_TEMP/body.md"

          gh pr create --base main --head "$BRANCH" \
            --title "Sync official starter (${SHA:0:12})" \
            --body-file "$RUNNER_TEMP/body.md"

          # Pushes made by the Actions token do not start other workflows on their own.
          gh workflow run ci.yml --ref "$BRANCH"
